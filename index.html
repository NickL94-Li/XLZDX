<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCE · 小罗智多星使用复盘看板 2026-09</title>
<style>
:root{
  --bg:#EEF1F8;--card:#fff;--navy:#0C2850;--blue:#1454B8;
  --g:#196E3C;--gb:#2EA856;--gbg:#EBF8F2;
  --a:#A05208;--ab:#D4780F;--abg:#FEF3E2;
  --r:#B31818;--rb:#E03A3A;--rbg:#FEF1F1;
  --pur:#7240C8;--purbg:#F5F0FF;
  --teal:#0D7E7E;--tealbg:#E6F5F5;
  --s:#576070;--sbg:#EEF1F5;
  --mut:#6B7A90;--bdr:#E0E7F0;
  --sh:0 1px 3px rgba(12,40,80,.06),0 4px 18px rgba(12,40,80,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:#1a2535;font-size:14px}
.hdr{background:linear-gradient(135deg,#0C2850 0%,#1454B8 100%);color:#fff;padding:24px 0 20px}
.hdr-inner{max-width:1300px;margin:0 auto;padding:0 28px}
.hdr-title{font-size:22px;font-weight:700;letter-spacing:.5px;margin-bottom:6px}
.hdr-meta{font-size:12px;opacity:.7}
.tab-bar{background:var(--card);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(12,40,80,.08)}
.tab-bar-inner{max-width:1300px;margin:0 auto;padding:0 28px;display:flex;gap:0}
.tbtn{background:none;border:none;border-bottom:2px solid transparent;padding:13px 18px;font-size:13px;font-family:inherit;color:var(--mut);cursor:pointer;transition:color .15s;margin-bottom:-1px;white-space:nowrap}
.tbtn:hover{color:var(--navy)}
.tbtn.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tbtn.teal-tab{color:var(--teal)}
.tbtn.teal-tab.active{color:var(--teal);border-bottom-color:var(--teal)}
.tab-divider{width:1px;background:var(--bdr);margin:10px 8px}
.tab-content{max-width:1300px;margin:0 auto;padding:28px 28px 40px}
.hidden{display:none!important}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:26px}
.kpi-card{background:var(--card);border-radius:10px;box-shadow:var(--sh);padding:20px 18px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-card.c-blue::before{background:var(--blue)}
.kpi-card.c-green::before{background:var(--gb)}
.kpi-card.c-amber::before{background:var(--ab)}
.kpi-card.c-pur::before{background:var(--pur)}
.kpi-card.c-navy::before{background:var(--navy)}
.kpi-card.c-teal::before{background:var(--teal)}
.kpi-label{font-size:11px;color:var(--mut);margin-bottom:8px;letter-spacing:.3px}
.kpi-val{font-size:26px;font-weight:700;color:var(--navy);line-height:1.1}
.kpi-val em{font-size:13px;font-weight:500;color:var(--mut);font-style:normal}
.kpi-sub{font-size:11px;color:var(--mut);margin-top:7px}
.kpi-sub.warn{color:var(--ab)}
.kpi-sub2{font-size:11px;color:var(--pur);margin-top:4px}
.sec-title{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:'';display:inline-block;width:3px;height:15px;background:var(--blue);border-radius:2px;flex-shrink:0}
.sec-title.teal::before{background:var(--teal)}
.card-wrap{background:var(--card);border-radius:10px;box-shadow:var(--sh);padding:22px 24px;margin-bottom:24px}
.nat-table{width:100%;border-collapse:collapse;font-size:13px}
.nat-table th{text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--bdr);color:var(--mut);font-weight:500;font-size:11px;white-space:nowrap;letter-spacing:.3px;cursor:help}
.nat-table th[title]:hover{color:var(--blue)}
.nat-table td{padding:10px 10px;border-bottom:1px solid #F0F4FA;vertical-align:middle}
.nat-table tr.clickable{cursor:pointer}
.nat-table tr.clickable:hover td{background:#F5F8FF}
.nat-table tr.subtotal td{background:#F0F4FA;font-weight:600;color:var(--navy)}
.nat-table tr.hq td{background:#FAFBFD}
.nat-table tr.total td{background:var(--navy);color:#fff;font-weight:700}
.nat-table tr.total .rbadge{background:rgba(255,255,255,.18);color:#fff}
.nat-table tr.sep-row td{padding:3px;border:none;background:var(--bg)}
.nat-table .c-g{color:var(--g);font-weight:600}
.nat-table .c-a{color:var(--a);font-weight:600}
.nat-table .c-r{color:var(--r);font-weight:600}
.nat-table .c-s{color:var(--s)}
.nat-table .c-teal{color:var(--teal);font-style:italic;font-size:12px}
.rbadge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700}
.rg{background:var(--gbg);color:var(--g)}
.ra{background:var(--abg);color:var(--a)}
.rr{background:var(--rbg);color:var(--r)}
.rs{background:var(--sbg);color:var(--s)}
.tier{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.t-act{background:var(--gbg);color:var(--g)}
.t-wake{background:var(--abg);color:var(--a)}
.t-dead{background:var(--purbg);color:var(--pur)}
.t-stop{background:var(--sbg);color:var(--s)}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart-card{background:var(--card);border-radius:10px;box-shadow:var(--sh);padding:20px 22px}
.chart-card-wide{background:var(--card);border-radius:10px;box-shadow:var(--sh);padding:20px 28px;margin-bottom:24px}
.chart-title{font-size:12px;font-weight:600;color:var(--navy);margin-bottom:14px}
.fbar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fbar-label{width:68px;font-size:13px;color:var(--mut);text-align:right;flex-shrink:0}
.fbar-bg{flex:1;background:#EEF1F8;border-radius:5px;height:10px}
.fbar-fill{height:10px;border-radius:5px}
.fbar-val{font-size:13px;color:var(--mut);width:120px;flex-shrink:0;text-align:right}
.fbar-row{margin-bottom:16px}
.reg-hdr{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.reg-title{font-size:20px;font-weight:700;color:var(--navy)}
.reg-head-lbl{font-size:13px;color:var(--mut)}
.reg-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.acc-table{width:100%;border-collapse:collapse;font-size:13px}
.acc-table th{text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--bdr);color:var(--mut);font-weight:500;font-size:11px;letter-spacing:.3px;cursor:help}
.acc-table th[title]:hover{color:var(--blue)}
.acc-table td{padding:10px 10px;border-bottom:1px solid #F0F4FA;vertical-align:middle}
.acc-table tr:last-child td{border-bottom:none}
.acc-table tr.stopped td{color:#aaa;background:#FAFBFC}
.hf-badge{display:inline-block;background:#FFF3E0;color:#E65100;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:middle}
.dep-warn{color:var(--ab);font-size:11px;margin-left:3px}
.stopped-mark{display:inline-block;background:var(--sbg);color:var(--s);font-size:10px;padding:1px 5px;border-radius:4px;margin-left:4px}
.dual-badge{display:inline-block;background:var(--tealbg);color:var(--teal);font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:4px}
.xq-val{color:var(--pur);font-style:italic}
.sb-hdr{background:linear-gradient(135deg,#0D5050 0%,#0D7E7E 100%);color:#fff;border-radius:10px;padding:20px 24px;margin-bottom:22px}
.sb-hdr-title{font-size:18px;font-weight:700;margin-bottom:6px}
.sb-hdr-desc{font-size:12px;opacity:.75;line-height:1.6}
.sb-table{width:100%;border-collapse:collapse;font-size:13px}
.sb-table th{text-align:left;padding:8px 12px;border-bottom:1.5px solid var(--bdr);color:var(--mut);font-weight:500;font-size:11px;letter-spacing:.3px}
.sb-table td{padding:12px;border-bottom:1px solid #F0F4FA;vertical-align:middle}
.sb-table tr:last-child td{border-bottom:none}
.footnote{text-align:center;color:var(--mut);font-size:11px;margin-top:24px;line-height:2}
/* tooltip */
[title]{position:relative}
/* 变化分析 */
.diff-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.diff-table{width:100%;border-collapse:collapse;font-size:12px}
.diff-table th{text-align:center;padding:8px 8px;border-bottom:1.5px solid var(--bdr);color:var(--mut);font-weight:500;font-size:11px;letter-spacing:.3px;background:#F8FAFB}
.diff-table th.th-left{text-align:left}
.diff-table td{padding:9px 8px;border-bottom:1px solid #F0F4FA;text-align:center;vertical-align:middle}
.diff-table td.td-left{text-align:left;font-weight:600}
.diff-table tr.subtotal td{background:#F0F4FA;font-weight:600}
.diff-table tr.total td{background:var(--navy);color:#fff;font-weight:700}
.up{color:var(--g);font-weight:700}
.dn{color:var(--r);font-weight:700}
.nc{color:var(--mut)}
.delta{font-size:12px}
.change-sec{background:var(--card);border-radius:10px;box-shadow:var(--sh);padding:20px 24px;margin-bottom:22px}
/* trend tooltip */
.trend-tip{position:fixed;background:rgba(12,40,80,.88);color:#fff;font-size:12px;padding:6px 10px;border-radius:6px;pointer-events:none;display:none;z-index:999;white-space:nowrap}

@media (max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}.diff-kpi-row{grid-template-columns:repeat(2,1fr)}.reg-kpis{grid-template-columns:repeat(2,1fr)}.charts-row{grid-template-columns:1fr}}@media (max-width:640px){body{font-size:13px}.hdr{padding:16px 0 14px}.hdr-inner{padding:0 14px}.hdr-title{font-size:18px}.hdr-meta{font-size:11px;line-height:1.6}.tab-content{padding:14px 12px 32px}.tab-bar-inner{padding:0 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}.tbtn{padding:12px 11px;flex:0 0 auto}.tab-divider{margin:10px 4px}.card-wrap{padding:16px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}.chart-card{padding:16px 14px}.chart-card-wide{padding:16px 14px}.kpi-row,.diff-kpi-row,.reg-kpis{grid-template-columns:repeat(2,1fr);gap:10px}.kpi-card{padding:14px 12px}.kpi-val{font-size:20px}.reg-title{font-size:17px}.reg-hdr{gap:8px;margin-bottom:16px}.sb-hdr{padding:16px 14px}.sb-hdr-title{font-size:16px}.nat-table,.acc-table,.diff-table,.sb-table{min-width:700px}.fbar-label{width:52px;font-size:12px}.fbar-val{width:92px;font-size:12px}}</style>
</head>

function switchTab(btn,name){
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(d=>d.classList.add('hidden'));
  document.getElementById('tab-'+name).classList.remove('hidden');
}
function switchTabByName(r){
  const btn=document.querySelector('.tbtn[data-tab="'+r+'"]');
  if(btn) switchTab(btn,r);
}

function tip(desc,label){
  return '<span title="'+desc+'" style="border-bottom:1px dashed var(--bdr);cursor:help">'+label+'</span>';
}

function agg(accs){
  const stop=accs.filter(a=>a.tier==='已停用');
  const valid=accs.filter(a=>a.tier!=='已停用');
  const act=valid.filter(a=>a.tier==='活跃');
  const act2=valid.filter(a=>(a.recent2||0)>0);
  const wake=valid.filter(a=>a.tier==='待唤醒');
  const dead=valid.filter(a=>a.tier==='未激活');
  const hf=valid.filter(a=>a.highFreq);
  const rec=accs.reduce((s,a)=>s+a.recent,0);
  const rec2=accs.reduce((s,a)=>s+(a.recent2||0),0);
  const tot=accs.reduce((s,a)=>s+a.tot,0);
  const xqR=accs.reduce((s,a)=>s+(a.xq_rec||0),0);
  const xqR2=accs.reduce((s,a)=>s+(a.xq_rec2||0),0);
  const xqT=accs.reduce((s,a)=>s+(a.xq_tot||0),0);
  return{n:accs.length,valid:valid.length,act:act.length,act2:act2.length,wake:wake.length,dead:dead.length,stop:stop.length,hf:hf.length,rec,rec2,tot,xqR,xqR2,xqT};
}

function rateClass(a,valid){
  if(!valid) return 'rs';
  const p=a/valid;
  return p>=0.65?'rg':p>=0.35?'ra':'rr';
}
function rateBadge(str,cls){return '<span class="rbadge '+cls+'">'+str+'</span>';}
function tierBadge(tier){
  const cls={活跃:'t-act',待唤醒:'t-wake',未激活:'t-dead',已停用:'t-stop'}[tier]||'t-dead';
  return '<span class="tier '+cls+'">'+tier+'</span>';
}

// ── SVG Trend with hover tooltip ────────────────────────────────────────
let _gc=0;
const tipEl=document.getElementById('trendTip');
function renderTrend(el,monthly,color){
  if(!el) return;
  color=color||'#1454B8';
  const id='g'+(++_gc);
  const vals=MONTHS.map(m=>monthly[m]||0);
  const maxV=Math.max(...vals,1);
  const W=560,H=180,PL=38,PR=12,PT=12,PB=28;
  const cw=W-PL-PR,ch=H-PT-PB,n=vals.length;
  const pts=vals.map((v,i)=>({x:PL+(n>1?i*cw/(n-1):cw/2),y:PT+ch-(v/maxV*ch),v,m:MONTHS[i]}));
  const poly=pts.map(p=>p.x+','+p.y).join(' ');
  const area=pts[0].x+','+(PT+ch)+' '+poly+' '+pts[n-1].x+','+(PT+ch);
  const yLines=[0,.5,1].map(r=>{
    const yy=PT+ch*(1-r);
    return '<line x1="'+PL+'" y1="'+yy+'" x2="'+(W-PR)+'" y2="'+yy+'" stroke="#E0E7F0" stroke-width="1"/>'+
           '<text x="'+(PL-4)+'" y="'+(yy+4)+'" text-anchor="end" fill="#9BAABB" font-size="9">'+Math.round(maxV*r)+'</text>';
  }).join('');
  const xLbls=pts.map((p,i)=>(i%3!==0&&i!==n-1)?'':
    '<text x="'+p.x+'" y="'+(H-4)+'" text-anchor="middle" fill="#9BAABB" font-size="9">'+MONTHS[i].slice(2)+'</text>').join('');
  // hover circles (invisible large hit area)
  const hitCircles=pts.map((p,i)=>
    '<circle cx="'+p.x+'" cy="'+p.y+'" r="14" fill="transparent" class="trend-hit" data-v="'+p.v+'" data-m="'+p.m+'"/>').join('');
  const dotCircles=pts.map(p=>'<circle cx="'+p.x+'" cy="'+p.y+'" r="3" fill="'+color+'" class="trend-dot"/>').join('');
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+color+'" stop-opacity=".18"/>'+
    '<stop offset="100%" stop-color="'+color+'" stop-opacity=".01"/></linearGradient></defs>'+
    yLines+'<polygon points="'+area+'" fill="url(#'+id+')"/>'+
    '<polyline points="'+poly+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    dotCircles+hitCircles+xLbls+'</svg>';
  // bind hover
  el.querySelectorAll('.trend-hit').forEach(c=>{
    c.addEventListener('mouseenter',e=>{
      const r=e.target.getBoundingClientRect();
      tipEl.style.display='block';
      tipEl.style.left=(r.left+r.width/2)+'px';
      tipEl.style.top=(r.top-36)+'px';
      tipEl.textContent=e.target.dataset.m+'  '+e.target.dataset.v;
      // highlight dot
      el.querySelectorAll('.trend-dot').forEach(d=>d.setAttribute('r','3'));
      const idx=Array.from(el.querySelectorAll('.trend-hit')).indexOf(e.target);
      el.querySelectorAll('.trend-dot')[idx]?.setAttribute('r','5');
    });
    c.addEventListener('mouseleave',()=>{
      tipEl.style.display='none';
      el.querySelectorAll('.trend-dot').forEach(d=>d.setAttribute('r','3'));
    });
  });
}

// ── Function bars ────────────────────────────────────────────────────────
function renderFunc(el,fg){
  if(!el) return;
  const tot=FG_ORDER.reduce((s,g)=>s+(fg[g]||0),0);
  el.innerHTML=FG_ORDER.map(g=>{
    const v=fg[g]||0,pct=tot?Math.round(v/tot*100):0,bw=tot?Math.round(v/tot*100):0;
    return '<div class="fbar-row"><div class="fbar-label">'+g+'</div>'+
      '<div class="fbar-bg"><div class="fbar-fill" style="width:'+bw+'%;background:'+FG_COLOR[g]+'"></div></div>'+
      '<div class="fbar-val" style="color:'+FG_COLOR[g]+'">'+v.toLocaleString()+'次 · '+pct+'%</div></div>';
  }).join('');
}

// ── 变化分析（7月 vs 8月）────────────────────────────────────────────
function renderDiff(){
  const md=D.monthly_detail;
  const da=D.diff_accounts;
  const CMP6='2026-08', CMP7='2026-09';

  function fmt1(n){ const r=Math.round(n*10)/10; return r===Math.round(r)?Math.round(r):r; }
  function dv(v7,v6,inv){
    const d=v7-v6;
    if(Math.abs(d)<0.05) return '<span class="nc delta">—</span>';
    const up=d>0,good=inv?!up:up,cls=good?'up':'dn';
    return '<span class="'+cls+' delta">'+(up?'▲':'▼')+fmt1(Math.abs(d))+'</span>';
  }

  const g=md['全部'];
  const kpis='<div class="diff-kpi-row">'+
    '<div class="kpi-card c-green">'+
    '<div class="kpi-label">月活跃账号数</div>'+
    '<div class="kpi-val">'+g.act7+'<em> / '+g.valid+' 人</em></div>'+
    '<div class="kpi-sub">'+CMP6+' '+g.act6+' 人 &nbsp;'+dv(g.act7,g.act6)+'</div></div>'+

    '<div class="kpi-card c-pur">'+
    '<div class="kpi-label">操作次数（包含学习星球）</div>'+
    '<div class="kpi-val">'+g.ops7+'<em> 次</em></div>'+
    '<div class="kpi-sub">'+CMP6+' '+g.ops6+' 次 &nbsp;'+dv(g.ops7,g.ops6)+'</div></div>'+

    '<div class="kpi-card c-amber">'+
    '<div class="kpi-label">'+tip('操作次数 ÷ 当月活跃账号数（仅统计有操作的账号）','活跃账号月均操作次数')+'</div>'+
    '<div class="kpi-val">'+g.avg7+'<em> 次/人</em></div>'+
    '<div class="kpi-sub">'+CMP6+' '+g.avg6+' 次/人 &nbsp;'+dv(g.avg7,g.avg6)+'</div>'+
    '<div class="kpi-sub2" style="font-size:10px">分母=当月活跃账号数</div></div>'+

    '<div class="kpi-card c-navy">'+
    '<div class="kpi-label">已停用账号数</div>'+
    '<div class="kpi-val">'+g.stop+'<em> 人</em></div>'+
    '<div class="kpi-sub">'+CMP6+' '+g.stop_prev+' 人 &nbsp;'+dv(g.stop,g.stop_prev,true)+'</div></div>'+
    '</div>';

  const DIFF_REGIONS=REGIONS.concat(['区域小计','总部','全部']);
  let rows='';
  for(const r of DIFF_REGIONS){
    const m=md[r]||{ops6:0,ops7:0,act6:0,act7:0,inact6:0,inact7:0,avg6:0,avg7:0,xq6:0,xq7:0,valid:0};
    const trCls=r==='全部'?' class="total"':(r==='区域小计'||r==='总部')?' class="subtotal"':'';
    rows+='<tr'+trCls+'>'+
      '<td class="td-left">'+r+'</td>'+
      '<td>'+m.act6+'</td><td>'+m.act7+'</td><td>'+dv(m.act7,m.act6)+'</td>'+
      '<td>'+m.ops6+'</td><td>'+m.ops7+'</td><td>'+dv(m.ops7,m.ops6)+'</td>'+
      '<td>'+m.avg6+'</td><td>'+m.avg7+'</td><td>'+dv(m.avg7,m.avg6)+'</td>'+
      '<td>'+m.stop_prev+'</td><td>'+m.stop+'</td><td>'+dv(m.stop,m.stop_prev,true)+'</td>'+
      '<td style="color:var(--pur)">'+(m.xq6||'—')+'</td><td style="color:var(--pur)">'+(m.xq7||'—')+'</td><td>'+(m.xq6||m.xq7?dv(m.xq7,m.xq6):'<span class="nc delta">—</span>')+'</td>'+
      '</tr>';
  }

  const diffTable='<div class="change-sec">'+
    '<div class="sec-title">各大区 '+CMP6+' vs '+CMP7+' 对比</div>'+
    '<p style="font-size:11px;color:var(--mut);margin-bottom:12px">同一批账户、同一口径（包含学习星球），直接对比单月使用情况</p>'+
    '<table class="diff-table"><thead>'+
    '<tr>'+
      '<th class="th-left" rowspan="2">大区</th>'+
      '<th colspan="3" style="background:#EDF7F0;color:#196E3C">月活跃账号数</th>'+
      '<th colspan="3" style="background:#F5F0FF;color:#7240C8">操作次数</th>'+
      '<th colspan="3" style="background:#FFF8EE;color:#A05208">'+tip('操作次数÷当月活跃账号数','活跃账号月均操作次数')+'</th>'+
      '<th colspan="3" style="background:#F0F4FA;color:#576070">已停用账号</th>'+
      '<th colspan="3" style="background:#F5F0FF;color:#7240C8;opacity:.7">学习星球操作（单独统计）</th>'+
    '</tr><tr>'+
      '<th style="background:#EDF7F0">'+CMP6+'</th><th style="background:#EDF7F0">'+CMP7+'</th><th style="background:#EDF7F0">变化</th>'+
      '<th style="background:#F5F0FF">'+CMP6+'</th><th style="background:#F5F0FF">'+CMP7+'</th><th style="background:#F5F0FF">变化</th>'+
      '<th style="background:#FFF8EE">'+CMP6+'</th><th style="background:#FFF8EE">'+CMP7+'</th><th style="background:#FFF8EE">变化</th>'+
      '<th style="background:#F0F4FA">'+CMP6+'</th><th style="background:#F0F4FA">'+CMP7+'</th><th style="background:#F0F4FA">变化</th>'+
      '<th style="background:#F5F0FF;opacity:.7">'+CMP6+'</th><th style="background:#F5F0FF;opacity:.7">'+CMP7+'</th><th style="background:#F5F0FF;opacity:.7">变化</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';

  function accList(arr,showDelta){
    if(!arr.length) return '<span style="color:var(--mut);font-size:12px">—</span>';
    return arr.map(a=>{
      const tag='<span style="font-size:11px;color:var(--mut)">（'+a.region+'）</span>';
      const ops=showDelta?'<span style="font-size:11px;color:var(--mut)"> '+a.ops6+'→'+a.ops7+'次</span>':'';
      return '<div style="padding:4px 0;border-bottom:1px solid #F0F4FA">'+a.name+tag+ops+'</div>';
    }).join('');
  }

  const flows='<div class="change-sec">'+
    '<div class="sec-title">区域账户活跃状态变化（'+CMP7+' vs '+CMP6+'）</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px">'+
    '<div><div style="font-size:12px;font-weight:600;color:var(--g);margin-bottom:10px">▲ 新增活跃 ('+da.new_active.length+'人)</div>'+
    '<div style="font-size:13px">'+accList(da.new_active,false)+'</div></div>'+
    '<div><div style="font-size:12px;font-weight:600;color:var(--r);margin-bottom:10px">▼ 转为沉默 ('+da.went_silent.length+'人)</div>'+
    '<div style="font-size:13px">'+accList(da.went_silent,false)+'</div></div>'+
    '<div><div style="font-size:12px;font-weight:600;color:var(--blue);margin-bottom:10px">↔ 两月均活跃 ('+da.both_active.length+'人)</div>'+
    '<div style="font-size:13px">'+accList(da.both_active,true)+'</div></div>'+
    '<div><div style="font-size:12px;font-weight:600;color:var(--mut);margin-bottom:10px">○ 两月均无操作 ('+da.neither.length+'人)</div>'+
    '<div style="font-size:13px">'+accList(da.neither,false)+'</div></div>'+
    '</div></div>';

  document.getElementById('tab-变化分析').innerHTML=
    '<h2 style="font-size:18px;font-weight:700;color:var(--navy);margin-bottom:6px">总览变化分析</h2>'+
    '<div style="font-size:12px;color:var(--mut);margin-bottom:20px">'+
    '同口径对比 '+CMP6+' vs '+CMP7+' 单月使用情况 &nbsp;&middot;&nbsp; 有效账户已排除停用账号</div>'+
    kpis+diffTable+flows+
    '<div class="footnote">操作次数均含「学习星球」 &nbsp;&middot;&nbsp; 绿色/红色数值代表正向/负向变化 &nbsp;&middot;&nbsp; 均次 = 操作次数 ÷ 当月活跃账号数</div>';
}

// ── Init ──────────────────────────────────────────────────────────────
renderNational();
REGIONS.forEach(r=>renderRegion(r));
renderShengbi();
renderDiff();

</script>
</body>
</html>
